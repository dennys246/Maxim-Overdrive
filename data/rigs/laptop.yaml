version: 1  # the rig profile format (simcore.protocol.tiers.RIG_PROFILE_VERSION); v0 carried physics and is refused
# Rendering tier: how much of the world this machine's client draws. Every tier simulates the same world at the same
# grid spacing (world_model D20); a tier changes what is drawn, never what happens.
name: laptop
