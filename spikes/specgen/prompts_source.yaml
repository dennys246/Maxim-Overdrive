# The spec generator spike's 200 prompts (plan §4), written in-house; public sets lent category names only. split.py
# deals them into prompts_dev.yaml and prompts_heldout.yaml with a seeded generator, so no one chooses the held-out
# set. Every text is quoted: an unquoted comma once split a text in two (freeze round 1). Keys:
# - `expect`: the materials an object must contain where it leaves no doubt (M4; M2(b) when it lists two or more);
# - `breaks`: impossible prompts only, the budget the wording targets (extent, mass or primitives);
# - `single_ok`: one primitive is a correct answer, so M2(a) doesn't call it degenerate;
# - `hard: shape`: the object needs a shape boxes and upright cylinders can't make (a hollow or lying cylinder, a
#   curve or a slope), so M6 there measures the primitive set as much as the generator; reported apart.
# Every prompt outside the impossible stratum can be met within the budget (300 cm, 500 kg, 32 primitives) at the
# size its wording gives, checked by hand estimate in freeze round 1.
