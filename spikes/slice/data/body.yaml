# The slice's body tunables (docs/plans/vertical_slice.md §3.4). Throwaway lane: gamey values, tuned by playing.
version: slice-0
body:
  mass_kg: 80.0
  radius_m: 0.3
  height_m: 1.8
  walk_speed_m_s: 1.5
  overdrive_speed_m_s: 3.0
  # The drive is a velocity servo: force = mass * (target velocity - velocity) / response_s. Smaller is snappier.
  response_s: 0.15
  # No body moves faster than this, knockback included; with substeps it caps the distance moved per substep.
  max_speed_m_s: 6.0
  substeps: 8
  # Lifts the collision cylinder off the floor so the floor's top cell never blocks a step.
  step_clearance_m: 0.05
kindle:
  reach_m: 1.5
heat:
  # The cyberware's lumped thermal node (heat_debt.py). Gamey, tuned to a ladder (tests/test_heat_debt.py): Overdrive
  # trips after about 2.8 minutes in still air, 65 s standing 1 m from a burning crate, 31 s doing both, and never in
  # the puddle.
  capacity_j_k: 1500.0
  start_c: 37.0
  overdrive_w: 1200.0
  h_a_w_k: 4.5
  radiant_area_m2: 0.3        # the cyberware's share of the body's area facing a fire
  coolant_kg: 0.03
  coolant_refill_kg_s: 0.0001
  puddle_refill_kg_s: 0.01
  boil_c: 45.0
  evap_max_kg_s: 0.0006
  latent_j_kg: 2260000.0      # water's latent heat of vaporisation
  warn_c: 70.0
  trip_c: 85.0
  trip_s: 10.0
  tripped_speed_factor: 0.5
  sense_radius_m: 1.0         # T_air is the mean air temperature in this sphere around the body
strike:
  # Gamey. A strike cracks what it hits; it can't breach a wall (a walkable gap in 0.4 m drywall took 31 strikes of
  # 250 kJ: the world's crater law, measured for the plan's week 3, owner 2026-11-21).
  reach_m: 1.0
  energy_j: 2000.0              # an ordinary blow: dents nothing
  overdrive_energy_j: 120000.0  # an Overdrive blow: cracks wood and drywall where it lands
  sigma_m: 0.2                  # the action limits' minimum: the coarsest rig's cell
  overdrive_heat_j: 6000.0      # each Overdrive blow heats the cyberware by this much (4 K at 1500 J/K)
  recoil_ns: 40.0               # the kick back on the striker, newton-seconds (0.5 m/s on 80 kg)
