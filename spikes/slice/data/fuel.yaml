# The slice's fire (docs/plans/vertical_slice.md §3.3, VS4): a gamey fuel budget, not fire's model.
version: slice-0
materials:
  wood:
    releasable_energy_j_kg: 12400000.0  # the tile spec's effective heat of combustion (tile_and_client.md §1)
    ignition_c: 300.0                   # skin temperature at which wood lights (gamey: piloted ignition is ~300-365 C)
    burn_rate_kg_s_m2: 0.016            # gamey: a 0.6 m crate burns about 3.5 minutes
objects:
  # The burnable share of each box (slats and packing, not a solid block): gamey, per object.
  crate: 0.025
  crate_far: 0.025
  pallet: 0.03
fire:
  radiant_fraction: 0.3     # the share of a fire's power radiated: 0.3 is the usual figure for wood fires
  source_radius_m: 0.3      # the heat source's sphere in the world, at the action limits' minimum
  burnout_fraction: 0.05    # out at 5% of fuel left, the tile spec's t_gone rule
  skin_depth_m: 0.002       # the heated surface layer that decides ignition
  skin_h_w_m2k: 10.0        # natural convection from a vertical face
  emissivity: 0.9           # wood
