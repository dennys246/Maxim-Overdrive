[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "maxim-overdrive"
dynamic = ["version"]  # one source: simcore.__version__ (boundaries §11.2, W13)
description = "World server for Maxim Overdrive: material cells, physics fields and an SEM bridge for Maxim agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Denny Schaedig" }]
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# The SEM bridge builds real maxim Entities when pymaxim is installed; without it the world server still runs.
maxim = ["pymaxim>=1.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "diff-cover>=9.0",
    "ruff>=0.15",
    "mypy>=1.15",
    "types-PyYAML>=6.0",
    # The standards lint parses docs as they render (CommonMark plus tables); MIT. Its tests pass on 3.0.0, 4.0.0 and
    # 4.3.0. No cap: a release that changes token maps turns them red with no local change, which is drift caught.
    "markdown-it-py>=3.0",
    "pillow>=11.0",  # reads and writes PNG goldens for scripts/golden_compare.py
    # The layer contracts (boundaries §10, [tool.importlinter] below); BSD-2-Clause. Pinned, since a release can change
    # how a contract is read. 2.6 is the newest that resolves beside pymaxim: import-linter 2.7+ needs rich>=14, and
    # pymaxim 1.3 caps rich below 14 (2026-11-19). Raise both pins when pymaxim lifts its cap.
    "import-linter==2.6",
    "grimp==3.13",
]

[tool.hatch.version]
path = "src/simcore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/simcore", "src/maxim_overdrive"]

# The game's data ships inside the game package, beside maxim_overdrive.data.data_dir, which reads it; the engine has
# no default path into data (boundaries §3).
[tool.hatch.build.targets.wheel.force-include]
"data" = "maxim_overdrive/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["slow: takes more than a few seconds; gate it behind a tier variable (CLAUDE.md, Testing)"]
xfail_strict = true          # a red gate that unexpectedly passes is a failure, not a silent pass
filterwarnings = ["error"]   # warnings are bugs until proven otherwise

# Ruff: lint and format. The rule set is in CLAUDE.md ("Engineering standards"); BLE and S110 are the
# no-silent-swallow rule, B905 makes every zip say whether lengths must match.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "BLE", "S110", "PT", "NPY", "PL", "C90"]
ignore = [
    "PLR2004",  # magic numbers: physics constants are named where they mean something, literal where they don't
    "PLR0913",  # many arguments: physics functions take their parameters explicitly
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

# Separation of concerns (CLAUDE.md, "Code"). Ruff's PL rules already cap returns, branches and statements per function;
# mccabe caps the paths through it. scripts/lint_sizes.py::check_sizes holds the limits ruff has no rule for, and
# refuses a noqa for any of these codes in src/ and scripts/.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.maxim_overdrive.size_limits]
function_lines = 40   # body lines, docstring excluded; a nested function counts towards its parent too
module_lines = 500
public_methods = 12   # per class, defined in its own body

# Import contracts (boundaries O24, §2.2, §3, §8.1, §9.2). The gate runs them in scripts/prepush.sh::lint_imports;
# tests/test_tooling_config.py holds the root packages to the packages under src/, every child of simcore to a layer,
# and the sealed core's list to tests/test_determinism.py::SEALED_CORE_BANNED, which the core's AST scan also reads.
# A layer imports only the layers below it.
[tool.importlinter]
root_packages = ["maxim_overdrive", "simcore"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "game > protocol > adapters > core"
type = "layers"
layers = ["maxim_overdrive", "simcore.protocol", "simcore.adapters", "simcore.core"]

# The layers contract checks only modules inside a layer, so the engine-never-imports-the-game rule (B-1) is its own
# contract, covering simcore's root module and any child not yet in a layer.
[[tool.importlinter.contracts]]
id = "engine-not-game"
name = "the engine never imports the game (boundaries §2.1, B-1)"
type = "forbidden"
source_modules = ["simcore"]
forbidden_modules = ["maxim_overdrive"]

[[tool.importlinter.contracts]]
id = "sealed-core"
name = "the sealed core imports no clock, entropy, OS, file IO, concurrency or Maxim (boundaries §3)"
type = "forbidden"
source_modules = ["simcore.core"]
# The core uses none of these (it imports math, numbers, collections, dataclasses, types, typing, numpy and scipy).
# logging is banned although §3 allowed it for output: a record carries a wall-clock stamp and a handler can write a
# file, and the core logs nothing today.
forbidden_modules = [
    "time", "timeit", "datetime", "zoneinfo", "random", "secrets", "uuid",
    "os", "importlib", "sys", "platform", "locale", "signal", "gc", "weakref", "ctypes",
    "pathlib", "io", "yaml", "json", "tempfile", "shutil", "glob", "pickle", "marshal", "shelve", "dbm", "sqlite3",
    "mmap", "logging", "builtins", "codecs", "fileinput", "linecache", "tokenize", "zipfile", "tarfile", "gzip",
    "bz2", "lzma",
    "threading", "_thread", "asyncio", "concurrent", "multiprocessing", "subprocess", "queue", "sched",
    "socket", "select", "selectors", "ssl", "http", "urllib", "websockets",
    "maxim",
]

# Skip-layer rule (boundaries §2.2, S2): the adapters and the protocol reach the core only through its public surface,
# the simulation (world, applier, frames), the intents (intents, limits), the material types and the checks. Never the
# cells, the laws, the geometry and scene build, imagination's internals or the core's array helpers. Direct imports
# only: reaching the cells through the world is the point of the public surface. tests/test_tooling_config.py holds
# the list to every core module outside that surface, so a new core module must be classified.
[[tool.importlinter.contracts]]
id = "skip-layer"
name = "adapters and protocol reach no cells, laws, geometry or scene build (boundaries §2.2, S2)"
type = "forbidden"
source_modules = ["simcore.adapters", "simcore.protocol"]
forbidden_modules = [
    "simcore.core.damage", "simcore.core.grid", "simcore.core.heat", "simcore.core.imagination",
    "simcore.core.readonly", "simcore.core.scene",
]  # fmt: skip
allow_indirect_imports = true

# B-13's import half (boundaries §4.4): the SEM membrane reads the world through published frames (and, from step 5a,
# the field registry) and changes it through the applier, the two capabilities it is handed. On top of the skip-layer
# rule it gives up the material types, the file gates and the world itself. tests/test_tooling_config.py holds the list to every core module outside its surface.
[[tool.importlinter.contracts]]
id = "membrane-reads-frames"
name = "the SEM membrane reads frames and writes through the applier only (boundaries §4.4, B-13)"
type = "forbidden"
source_modules = ["simcore.adapters.sem"]
forbidden_modules = [
    "simcore.core.damage", "simcore.core.grid", "simcore.core.heat", "simcore.core.imagination",
    "simcore.core.materials", "simcore.core.readonly", "simcore.core.scene", "simcore.core.world",
    "simcore.adapters.loaders",
]  # fmt: skip
allow_indirect_imports = true

# Input primitives by source (boundaries §5.2, B-4): only the file gates parse YAML or JSON, and nothing decodes pickle
# or marshal. Direct imports only, so a module that calls a gate (tiers, the game's data) passes; the one gate import
# is named. scripts/lint_inputs.py holds the calls an import can't show (open, read_text, np.load, the environment).
[[tool.importlinter.contracts]]
id = "input-primitives"
name = "only the file gates parse YAML or JSON, and nothing unpickles (boundaries §5.2, B-4)"
type = "forbidden"
source_modules = ["simcore", "maxim_overdrive"]
forbidden_modules = ["yaml", "json", "pickle", "marshal", "shelve"]
ignore_imports = ["simcore.adapters.loaders -> yaml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "maxim-through-adapters"
name = "only the SEM membrane imports maxim (boundaries §8.1)"
type = "protected"
protected_modules = ["maxim"]
allowed_importers = ["simcore.adapters.sem"]

[[tool.importlinter.contracts]]
id = "tests-out"
name = "the shipped packages never import test tooling (boundaries §9.2)"
type = "forbidden"
source_modules = ["simcore", "maxim_overdrive"]
forbidden_modules = ["pytest", "_pytest", "hypothesis", "tests"]

# mypy: strict everywhere. pymaxim ships py.typed.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

# Tests: bodies are type-checked, but fixture-heavy signatures need no annotations.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# Coverage: branch coverage, with a floor that only ratchets up (CLAUDE.md, "Testing").
[tool.coverage.run]
source = ["src", "scripts"]  # by directory, so a new package under src/ is measured without an edit here
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
