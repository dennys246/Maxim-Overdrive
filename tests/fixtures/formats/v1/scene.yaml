# Golden scene at format version 1 (simcore.core.scene.SCENE). Never edit it to match a newer format:
# tests/test_formats.py holds the reader to it; a change that breaks it needs a version bump and a refusal test.
version: 1
extent_m: [3.0, 2.0, 2.0]
ambient_c: 20.0
spawns:
  - {name: player, archetype: human, holding: torch, at_m: [0.6, 1.0, 0.4]}
  - {name: guard, archetype: human, at_m: [2.4, 1.0, 0.4]}
primitives:
  - {kind: box, name: floor, material: concrete, min_m: [0.0, 0.0, 0.0], max_m: [3.0, 2.0, 0.4]}
  - {kind: cylinder, name: post, material: wood, center_xy_m: [1.5, 1.0], radius_m: 0.2, z_m: [0.4, 1.6]}
