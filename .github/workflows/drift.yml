# Dependency drift (owner decision O32). The gate and CI run on locked dependencies (constraints/); this job runs the
# same gate unpinned against the newest releases, the SEM drift test (tests/test_sem_compat.py) among it. A red run
# is the signal to regenerate the lock, or to update the SEM mirror when pymaxim changed its types; drift is never
# pinned away, only surfaced here instead of on every branch.
name: drift

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      MAXIM_OVERDRIVE_UNLOCKED: "1"  # scripts/check_lock.py: this job runs unpinned on purpose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install, unpinned
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade -e '.[dev,maxim]'
      - name: Gate
        env:
          BASE: origin/main
        run: scripts/prepush.sh
