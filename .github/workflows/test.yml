# Runs the same gate as a local push: scripts/prepush.sh (docs/standards_backlog.md B11).
name: prepush

# Pull requests, and pushes to main: a branch push without a PR is gated locally (scripts/prepush.sh) before hand-off,
# and running both doubled every PR's minutes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
# macOS runs on the owner's Mac mini as a self-hosted runner (label overdrive-mini): private-repo macOS minutes bill
# at 10x Linux's, and the mini already runs the gate. A self-hosted runner runs any PR's code on that machine, so
# remove it, and this mapping, before the repository is made public.
  prepush:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        python-version: ["3.12", "3.14"]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: overdrive-mini
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff coverage needs the merge base with main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints/py${{ matrix.python-version }}.txt -e '.[dev,maxim]'
      # The gate's Godot step (scripts/godot_check.py) needs the pinned Godot, which the runners don't have.
      - name: Install Godot
        run: godot="$(ci/install_godot.sh "$RUNNER_TEMP/godot")" && echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Gate
        env:
          BASE: origin/main
        run: scripts/prepush.sh
