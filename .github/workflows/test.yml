# Runs the same gate as a local push: scripts/prepush.sh (docs/standards_backlog.md B11).
name: prepush

# Pull requests, and pushes to main: a branch push without a PR is gated locally (scripts/prepush.sh) before hand-off,
# and running both doubled every PR's minutes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
# Linux on every run; macOS (billed at 10x Linux on a private repo) only on pushes to main. A PR's macOS check is the
# prepush PASS from the owner's Mac mini that every hand-off carries; untrusted PR code never runs on that machine.
  prepush:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff coverage needs the merge base with main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints/py${{ matrix.python-version }}.txt -e '.[dev,maxim]'
      # The gate's Godot step (scripts/godot_check.py) needs the pinned Godot, which the runners don't have.
      - name: Install Godot
        run: godot="$(ci/install_godot.sh "$RUNNER_TEMP/godot")" && echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Gate
        env:
          BASE: origin/main
        run: scripts/prepush.sh
