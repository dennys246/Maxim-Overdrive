# Runs the same gate as a local push: scripts/prepush.sh (docs/standards_backlog.md B11).
name: prepush

on:
  push:
  pull_request:

jobs:
  prepush:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff coverage needs the merge base with main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev,maxim]'
      - name: Gate
        env:
          BASE: origin/main
        run: scripts/prepush.sh
